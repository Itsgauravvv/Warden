name: Warden CI & Eval Regression Gate

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify-and-eval:
    name: Typecheck, Unit Tests & Eval Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run strict TypeScript typecheck
        run: pnpm typecheck

      - name: Run Eval Harness Regression Gate (TPR >= 95%, FPR <= 5%)
        run: pnpm --filter @warden/eval test

      - name: Run full workspace test suite
        run: pnpm test