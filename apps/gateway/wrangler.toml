name = "warden-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "warden-db"
database_id = ""
migrations_dir = "drizzle"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"